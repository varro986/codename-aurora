name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build CodenameAurora.slnx --configuration Release

      - name: Architecture tests
        run: dotnet test --filter "Category=Architecture" --no-build --configuration Release

      - name: Unit tests
        run: dotnet test --filter "Category!=Architecture" --no-build --configuration Release

      - name: Create or update GitHub Release with auto-generated notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release edit $tag --title "Aurora $tag"
          } else {
            gh release create $tag `
              --title "Aurora $tag" `
              --generate-notes
          }

      # Velopack packaging steps will be added when the signing certificate
      # and Velopack feed are provisioned (post-MVP).
