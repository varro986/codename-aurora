name: Notify Requestor (UAT)

# Triggered when a GitHub Release is published (not draft).
# Finds all issues closed by PRs included in this release via "Closes/Fixes/Resolves #N" references.
# Reopens each issue with status:uat and pings the original requestor for validation.
# Idempotent: skips issues already carrying status:uat (safe on release re-publish).

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Find closed issues and notify requestors
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const owner      = context.repo.owner;
            const repo       = context.repo.repo;
            const currentTag = context.payload.release.tag_name;

            // Find the previous published release to bound the commit range.
            const { data: releases } = await github.rest.repos.listReleases({ owner, repo, per_page: 10 });
            const previousRelease    = releases.find(r => r.tag_name !== currentTag && !r.draft && !r.prerelease);
            const previousTag        = previousRelease?.tag_name ?? null;

            core.info(`Current: ${currentTag} | Previous: ${previousTag ?? 'none (first release)'}`);

            // Collect commits between previous and current release.
            let commits = [];
            if (previousTag) {
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${previousTag}...${currentTag}`
              });
              commits = comparison.commits;
            } else {
              // First release: scan last 100 commits up to this tag.
              const { data: list } = await github.rest.repos.listCommits({
                owner, repo, sha: currentTag, per_page: 100
              });
              commits = list;
            }

            core.info(`Commits to scan: ${commits.length}`);

            // For each commit, find merged PRs and extract issue close references.
            const issueNumbers  = new Set();
            const closePattern  = /(?:closes|fixes|resolves)\s+#(\d+)/gi;

            for (const commit of commits) {
              const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: commit.sha
              });
              for (const pr of prs) {
                if (pr.state !== 'closed' || !pr.merged_at) continue;
                for (const match of (pr.body ?? '').matchAll(closePattern)) {
                  issueNumbers.add(parseInt(match[1]));
                }
              }
            }

            core.info(`Issues to notify: ${[...issueNumbers].join(', ') || 'none'}`);

            for (const num of issueNumbers) {
              let issue;
              try {
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: num });
                issue = data;
              } catch {
                core.warning(`Issue #${num} not found — skipping.`);
                continue;
              }

              // Idempotency: skip if already in UAT (prevents duplicate ping on release re-publish).
              if (issue.labels.some(l => l.name === 'status:uat')) {
                core.info(`Issue #${num} already in status:uat — skipping.`);
                continue;
              }

              // Reopen if closed
              if (issue.state !== 'open') {
                await github.rest.issues.update({ owner, repo, issue_number: num, state: 'open' });
              }

              // Remove status:review (lifecycle cleanup)
              try {
                await github.rest.issues.removeLabel({
                  owner, repo, issue_number: num, name: 'status:review'
                });
              } catch (_) {}

              // Add status:uat
              try {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: num, labels: ['status:uat']
                });
              } catch (_) {}

              // Determine who to ping: prefer explicit "**Requestor:** @handle" in issue body.
              const issueBody = issue.body || '';
              const requestorMatch = issueBody.match(/\*\*Requestor:\*\*\s*@([\w-]+)/i);
              const pingHandle = requestorMatch ? requestorMatch[1] : issue.user.login;

              await github.rest.issues.createComment({
                owner, repo, issue_number: num,
                body: [
                  `@${pingHandle} — the feature you requested has been released in **[${currentTag}](${context.payload.release.html_url})**.`,
                  '',
                  'Please verify that the implementation matches what you requested.',
                  '- ✅ If it is correct, **close this issue**.',
                  '- ❌ If something is wrong or missing, **leave a comment** describing the gap.',
                ].join('\n')
              });

              core.info(`Notified @${pingHandle} on issue #${num}.`);
            }
