name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  architecture-tests:
    name: Architecture Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build CodenameAurora.slnx --configuration Release

      - name: Architecture tests
        run: dotnet test --filter "Category=Architecture" --no-build --configuration Release
