name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  architecture-tests:
    name: Architecture Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build CodenameAurora.slnx --configuration Release

      - name: Architecture tests
        run: dotnet test --filter "Category=Architecture" --no-build --configuration Release
