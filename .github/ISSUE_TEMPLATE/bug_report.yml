name: Bug report
description: Something does not work as the specs say
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Steps to reproduce, what you expected, what you got. No personal or customer data.
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Related spec
      description: The feature in specs/features/ or the requirement (REQ-...) it breaks, if known.
