name: User Story
description: Propose a new feature. AI will review for contradictions before Lead Dev approval.
title: "[US] "
labels: ["status:draft"]
body:
  - type: markdown
    attributes:
      value: |
        Write the story, then submit. AI will review within minutes and comment.
        Max 3 AI rounds — if unresolved, Lead Dev is notified automatically.

  - type: input
    id: requestor
    attributes:
      label: "Requestor (optional)"
      description: "GitHub handle of the person who requested this feature, if different from the issue author."
      placeholder: "@handle"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "As a [role], I want [capability], so that [benefit]."
      placeholder: "As an operator, I want ... so that ..."
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Verifiable conditions. Each AC must be testable — avoid vague language.
      placeholder: |
        - When X happens, Y is the result.
        - Given Z state, the system does W.
    validations:
      required: true

  - type: textarea
    id: implications
    attributes:
      label: Implications
      description: What other behaviors change? What does the operator experience differently?
      placeholder: "- The overlay now dismisses automatically after 5 s\n- Settings panel shows a new field"
    validations:
      required: false

  - type: textarea
    id: test_cases
    attributes:
      label: Test Cases
      description: Key scenarios to verify. Leave blank if ACs are self-evident.
      placeholder: |
        - (Unit) Given null input, returns empty string without throwing.
        - (Integration) After file change, dictionary reloads within 1 s.
    validations:
      required: false

  - type: checkboxes
    id: dor
    attributes:
      label: Definition of Ready
      options:
        - label: Description follows the "As a / I want / so that" format
        - label: Every AC is testable — no "should feel" or "should be fast"
        - label: No feature overlaps an existing US in specs/features/
